# Builds the Printer Scanner APK on every push / pull request and on demand.
# The APK is attached to the run as an artifact (Actions tab → run → "Artifacts").
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK; use its newest sdkmanager directly.
      # Versions must match android/gradle.properties (generated) and plugins/withCmakeVersion.js
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.31.6" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild -p android --clean --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: printer-scanner-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
