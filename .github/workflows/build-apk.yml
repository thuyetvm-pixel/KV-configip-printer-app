# Builds the Printer Scanner APK on every push / pull request and on demand.
# The APK is attached to the run as an artifact (Actions tab → run → "Artifacts").
#
# Signing: when the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD exist (never on fork PRs), the APK is signed with the
# project's release key. Otherwise it is signed with the public debug key and named "...-TESTKEY".
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege for the workflow token.
permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Strictly increasing so every new APK installs over the previous one.
      ANDROID_VERSION_CODE: ${{ 1000 + github.run_number }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK; use its newest sdkmanager directly.
      # Versions must match android/gradle.properties (generated) and plugins/withCmakeVersion.js
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.31.6" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit (runtime packages)
        # Reported, not blocking: fixes often need an Expo SDK upgrade.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test -- --ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild -p android --clean --no-install

      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release keystore secret: APK is signed with the public DEBUG key (test only)."
            echo "suffix=-TESTKEY" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee apk-signature.txt
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && grep -q "CN=Android Debug" apk-signature.txt; then
            echo "::error::Release key configured but APK is debug-signed."; exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "printer-scanner-v${ANDROID_VERSION_CODE}${{ steps.keystore.outputs.suffix }}.apk"
          sha256sum printer-scanner-*.apk | tee apk-sha256.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: printer-scanner-apk-${{ github.run_number }}${{ steps.keystore.outputs.suffix }}
          path: |
            printer-scanner-*.apk
            apk-sha256.txt
            apk-signature.txt
          if-no-files-found: error
          retention-days: 30
