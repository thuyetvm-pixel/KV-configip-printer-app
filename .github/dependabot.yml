# npm: no routine version-update PRs (limit 0). Security fixes still arrive as PRs through
#      "Dependabot security updates" (repository Settings → Code security), which this limit
#      does not affect. Expo/React Native versions are upgraded together with the Expo SDK.
# GitHub Actions: one grouped PR per month.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
